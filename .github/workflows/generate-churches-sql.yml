name: Generate church import SQL

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-churches-sql:
    name: Download Egypt OSM extract and prepare SQL
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Osmium and Shapely
        run: |
          sudo apt-get update
          sudo apt-get install --yes osmium-tool
          python -m pip install --disable-pip-version-check "shapely>=2,<3"

      - name: Run the offline Egypt church importer
        id: importer
        run: python scripts/gcm-churches-offline.py

      - name: Upload generated SQL file
        if: ${{ always() && hashFiles('churches-full.sql') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: churches-full-sql
          path: churches-full.sql
          if-no-files-found: error
          retention-days: 7

      - name: Validate generated SQL file
        if: ${{ always() }}
        shell: bash
        run: |
          if [ ! -s churches-full.sql ]; then
            echo '::error::The offline importer did not create churches-full.sql. Check the importer log.'
            exit 1
          fi
          if grep -q '^-- WARNING: PARTIAL DATA' churches-full.sql; then
            echo '::error::Some matching OSM features could not be assigned to a governorate. The SQL artifact is available for inspection, but do not import it as a complete list.'
            exit 1
          fi
          echo 'The importer processed all matching OSM features and assigned them to the 27 governorates.'
